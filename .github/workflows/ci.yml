name: HIRIS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hiris_db
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install repository dependencies (workspaces)
      run: npm ci --include=dev

    - name: Run Database Migrations
      working-directory: ./apps/backend
      run: node migrate.js
      env:
        DATABASE_URL: postgres://postgres@localhost:5432/hiris_db

    - name: Build Frontend
      working-directory: ./apps/frontend
      run: npm run build

    - name: Backend Unit Tests
      working-directory: ./apps/backend
      run: npm test
      env:
        DATABASE_URL: postgres://postgres@localhost:5432/hiris_db
        JWT_SECRET: test-secret-32-chars-min-length!!

    - name: Backend Smoke Test
      working-directory: ./apps/backend
      run: |
        # Start server in background with dummy env vars
        DATABASE_URL=postgres://dummy JWT_SECRET=test-secret-key PORT=3001 node server.js > /tmp/server.log 2>&1 &
        SERVER_PID=$!
        
        # Wait for server to boot
        sleep 5
        
        # Check health endpoint with retries
        for i in {1..5}; do
          if curl -f http://localhost:3001/api/health; then
            echo "Server is healthy"
            break
          fi
          echo "Attempt $i: Waiting for server..."
          sleep 2
        done
        
        # Kill server and wait for it to terminate
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        
        # Show server logs if there were issues
        if [ $? -ne 0 ]; then
          echo "=== Server Log ==="
          cat /tmp/server.log
          exit 1
        fi
