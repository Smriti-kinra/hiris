name: HIRIS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install Frontend Dependencies
      working-directory: ./hiris-unified
      run: npm ci

    - name: Build Frontend
      working-directory: ./hiris-unified
      run: npm run build

    - name: Backend Smoke Test
      run: |
        cd backend
        # Start server in background with dummy env vars
        DATABASE_URL=postgres://dummy JWT_SECRET=dummy PORT=3001 node server.js &
        SERVER_PID=$!
        
        # Wait for server to boot
        sleep 3
        
        # Check health endpoint
        curl -f http://localhost:3001/api/health || exit 1
        
        # Kill server
        kill $SERVER_PID
