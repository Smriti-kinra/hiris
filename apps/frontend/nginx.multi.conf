# HIRIS Multi-Portal nginx Reverse Proxy Config
# Routes each subdomain/port to the correct portal service.
# Deploy behind a load balancer or use server_name blocks for domain-based routing.

# ── Landing / Login (port 5173) ──────────────────────────────────────────────
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html/landing;
    index index.html;

    location /api {
        proxy_pass         http://hiris-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /uploads {
        proxy_pass http://hiris-backend:3001;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

